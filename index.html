  if(screen==='start')drawStart();else drawLevelSelect();const b=menuButtons.find(b=>px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h);if(b)menuAction(b.id);
 }else if(screen==='paused'){
  if(px>=320&&px<=680){if(py>=280&&py<=335)togglePause();else if(py>=355&&py<=410){if(online.active)onlineLeave();else{screen='start';keys={};heldPointers.clear()}}}
 }else if(screen==='inventory'||screen==='crafting'){
  drawInventory();
  const b=inventoryButtons.find(b=>px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h);if(b)inventoryAction(b.id);
 }else if(screen==='victory'){
  const b=victoryButtons.find(b=>px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h);if(b)victoryAction(b.id);
 }else if(screen==='choose'){
  if(py>185&&py<430){const n=Math.floor((px-80)/175);if(n>=0&&n<5){selected=n;screen='buddy';keys={}}}
 }else if(screen==='buddy'){
  const card=buddyCards.find(b=>px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h);if(card){selectedBuddy=card.id;reset()}
 }else if(screen==='over'){drawOver();const b=overButtons.find(b=>px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h);if(b)gameOverAction(b.id)}
 else{
  if(py>=100&&py<=152&&px>=15&&px<=285){selectInventorySlot(px<152?1:2);return}
  if(py>=166&&py<=209&&px>=15&&px<=306){selectInventorySlot(3+Math.min(2,Math.floor((px-15)/99)));return}
  const b=buttons.find(v=>px>=v.x&&px<=v.x+v.w&&py>=v.y&&py<=v.y+v.h);
  if(b){heldPointers.set(e.pointerId,b.id);syncTouch();if(b.id==='jump')jump();if(b.id==='ability')ability();if(b.id==='item')useItem();if(b.id==='door')openBossDoor();if(b.id==='inventory')toggleInventory();if(b.id==='pause')togglePause();if(b.id==='interact')interactWorld()}
 }
});
function releasePointer(e){heldPointers.delete(e.pointerId);syncTouch()}
for(const event of ['pointerup','pointercancel','lostpointercapture'])c.addEventListener(event,releasePointer);
let lastFrame=null,accumulator=0;
function loop(now=performance.now()){
 if(lastFrame===null)lastFrame=now;
 accumulator+=Math.max(0,Math.min(100,now-lastFrame));lastFrame=now;
 while(accumulator>=1000/60){update();accumulator-=1000/60}
 onlineFrame(now);draw();syncMusic();requestAnimationFrame(loop);
}
addEventListener('blur',()=>{keys={};heldPointers.clear();lastFrame=null;accumulator=0;setMusicFocus(false)});
addEventListener('focus',()=>setMusicFocus(true));
loop();
</script>
</body>
</html>
