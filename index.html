 x.fillStyle='#d15a51';x.fillRect(18,77,40,23);x.fillStyle='#fff';x.font='bold 14px system-ui';x.textAlign='center';x.fillText('Cola',38,93);
 x.restore();
}
function drawColaFlow(flow){
 const ground=flow.groundY??floorAtX(flow.sourceX);
 x.save();x.globalAlpha=Math.min(1,flow.life/90);
 x.fillStyle='#70432c';x.strokeStyle='#412d26';x.lineWidth=2;
 x.beginPath();x.moveTo(flow.x,ground+3);
 for(let i=0;i<=flow.w;i+=3){const edge=Math.sin(Math.PI*i/flow.w);x.lineTo(flow.x+i,ground+3-edge*(22+Math.sin(i*.09-flow.age*.035)*3))}
 x.lineTo(flow.x+flow.w,ground+5);x.lineTo(flow.x,ground+5);x.closePath();x.fill();x.stroke();
 x.fillStyle='#ddc390';
 for(let i=0;i<5;i++){const bx=flow.sourceX+Math.sin(flow.age*.012+i*2)*flow.spread*.8;x.beginPath();x.arc(bx,ground-10,3+i%2,0,Math.PI*2);x.fill()}
 if(flow.age<240){
  const rise=Math.min(1,flow.age/60),pourX=flow.sourceX;
  x.strokeStyle='#b9854b';x.lineWidth=11;x.beginPath();x.moveTo(pourX,flow.sourceY+7);x.quadraticCurveTo(pourX+30*rise,flow.sourceY-20*rise,pourX+18,ground-5);x.stroke();
  x.fillStyle='#f0dfb4';for(let i=0;i<4;i++){const t=(flow.age/180+i/4)%1;x.beginPath();x.arc(pourX+Math.sin(t*Math.PI)*18,flow.sourceY+7+(ground-flow.sourceY-12)*t-18*Math.sin(t*Math.PI)*rise,2,0,Math.PI*2);x.fill()}
 }
 x.restore();
}
function drawScenery(){
 x.save();x.strokeStyle='#4c4435';x.lineWidth=3;
 for(const tree of trees){
  if(tree.x<camera-140||tree.x>camera+W+140)continue;
  const base=tree.baseY??ground;
  x.fillStyle='#b68255';x.beginPath();x.moveTo(tree.x-17,base);x.lineTo(tree.x-12,base-210);x.lineTo(tree.x+12,base-210);x.lineTo(tree.x+22,base);x.closePath();x.fill();x.stroke();
  x.lineWidth=13;x.strokeStyle='#93633f';x.beginPath();x.moveTo(tree.x,tree.hookY+35);x.lineTo(tree.hookX,tree.hookY);x.stroke();
  x.lineWidth=3;x.strokeStyle='#3b6941';
  for(const leaf of [[-38,-211,44,38],[35,-219,48,42],[-5,-249,55,44]]){x.fillStyle=leaf[0]<0?'#66b756':'#82c65e';x.beginPath();x.ellipse(tree.x+leaf[0],base+leaf[1],leaf[2],leaf[3],0,0,Math.PI*2);x.fill();x.stroke()}
  x.strokeStyle='#8b5c3d';x.lineWidth=2;x.beginPath();x.moveTo(tree.x-4,base-20);x.lineTo(tree.x-7,base-90);x.stroke();
  x.fillStyle='#ffe19a';x.strokeStyle='#7d592e';x.beginPath();x.arc(tree.hookX,tree.hookY,6,0,Math.PI*2);x.fill();x.stroke();
 }
 if(!boss)for(const p of platforms){
  if(p.moving||p.x+p.w<camera-30||p.x>camera+W+30)continue;
  x.fillStyle='#9a9f9d';x.strokeStyle='#4f5c58';x.lineWidth=3;x.beginPath();x.moveTo(p.x,p.y+p.h);x.lineTo(p.x+7,p.y+10);x.lineTo(p.x+18,p.y);x.lineTo(p.x+p.w-18,p.y);x.lineTo(p.x+p.w-4,p.y+13);x.lineTo(p.x+p.w,p.y+p.h);x.closePath();x.fill();x.stroke();
  x.strokeStyle='#c9d0c8';x.beginPath();x.moveTo(p.x+18,p.y+8);x.lineTo(p.x+p.w-23,p.y+8);x.stroke();
 }
 x.restore();
}
function draw(){x.clearRect(0,0,W,H); x.fillStyle='#80d5fb';x.fillRect(0,0,W,H);x.fillStyle='#fff5bd';x.beginPath();x.arc(850,90,45,0,7);x.fill();
 if(screen==='choose'||screen==='buddy'){x.fillStyle='#6abb54';x.fillRect(0,ground,W,H-ground)}
 if(screen==='choose'){drawChoose();return}
 if(screen==='buddy'){drawBuddyChoose();return}
 shakeX=Math.sin(tick*2.5)*shake*.5;shakeY=Math.cos(tick*3)*shake*.3;
 x.save();x.translate(-camera+shakeX,-cameraY+shakeY);drawTerrainFloors();drawScenery();drawExtraTerrain();drawLava();x.restore();drawGame();
 if(screenFlash>0){x.fillStyle='rgba(255,241,192,'+(screenFlash*.035)+')';x.fillRect(0,0,W,H)}
 if(screen==='over')drawOver();
 if(screen==='victory')drawVictory();
 if(screen==='inventory')drawInventory();
}
function drawChoose(){x.fillStyle='rgba(20,20,45,.82)';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#fff';x.font='bold 48px system-ui';x.fillText('FOOD FIGHTERS',W/2,95);x.font='24px system-ui';x.fillText('Wähle deinen Charakter',W/2,137);
 chars.forEach((ch,i)=>{let px=80+i*175, chosen=i===selected;x.fillStyle=chosen?'#fff4a3':'#ffffff';x.fillRect(px,185,145,245);x.strokeStyle=chosen?'#ff8b22':'#56567a';x.lineWidth=chosen?7:3;x.strokeRect(px,185,145,245);sprite(ch.art,px+29,196,87,104);x.fillStyle='#25253c';x.font='bold 19px system-ui';x.fillText(ch.name,px+72,305);x.font='15px system-ui';x.fillText(ch.ability,px+72,336);wrap(ch.text,px+14,365,116,17,'#25253c')});
 x.fillStyle='#fff';x.font='20px system-ui';x.fillText('Klicke eine Figur an oder nutze ← → und Enter',W/2,495);x.font='16px system-ui';x.fillText('Auf dem Handy: Figur antippen',W/2,525);
}
function wrap(t,px,py,width,line,color){x.fillStyle=color;x.font='14px system-ui';let words=t.split(' '),row='',y=py;for(let w of words){if(x.measureText(row+w).width>width){x.fillText(row,px+width/2,y);row='';y+=line}row+=w+' '}x.fillText(row,px+width/2,y)}
function drawGame(){
 x.fillStyle='rgba(0,0,0,.42)';x.fillRect(15,15,270,74);x.fillStyle='#fff';x.textAlign='left';x.font='bold 19px system-ui';x.fillText(chars[selected].name+'  Punkte: '+player.score,27,42);x.fillStyle='#472535';x.fillRect(27,58,190,16);x.fillStyle='#f34d55';x.fillRect(27,58,190*(player.hp/MAX_HP),16);x.fillStyle='#fff';x.font='14px system-ui';x.fillText('HP: '+player.hp+'/'+MAX_HP+'   '+chars[selected].ability+(player.cooldown?' ('+Math.ceil(player.cooldown/30)+')':''),27,84);
 x.textAlign='center';x.font='bold 20px system-ui';x.fillStyle='#203b52';x.fillText(message,W/2+70,38);
 if(!boss){x.textAlign='right';x.font='16px system-ui';x.fillText('Level '+level+' · '+Math.min(100,Math.round(player.x/doorX*100))+' %',W-20,75)}
 drawItemHud();
 x.save();x.translate(-camera+shakeX,-cameraY+shakeY);
 for(const flow of objects)if(flow.type==='colaFlow'&&flow.life>0&&flow.x+flow.w>camera-40&&flow.x<camera+W+40)drawColaFlow(flow);
 for(const o of objects){
  if((o.life!==undefined&&o.life<=0)||o.x+o.w<camera-60||o.x>camera+W+60)continue;
  if(o.type==='lunchbox'){x.save();if(o.used)x.globalAlpha=.5;sprite('lunchbox',o.x,o.y-7,o.w,o.h+10);if(o.used)sprite(o.item,o.x+16,o.y-22,28,28);x.restore()}
  if(o.type==='material'&&!o.collected)drawMaterial(o.material,o.x,o.y,o.w);
  if(o.type==='looseItem')sprite(o.item,o.x,o.y,o.w,o.h);
  if(o.type==='craftStation')drawCraftStation(o);
  if(o.type==='key'&&!o.collected)sprite('key',o.x,o.y+Math.sin(tick*.05)*5,o.w,o.h);
  if(o.type==='buddyCola')drawBuddyCola(o);
  if(o.type==='fire')drawFlame(o);
  if(o.type==='cola')drawBottle(o);
  if(o.type==='peel')sprite('peel',o.x-5,o.y-26,52,40);
  if(o.type==='hat')sprite('hat',o.x-5,o.y-12,34,38);
  if(o.type==='mentos'){x.fillStyle='#fff9cf';x.strokeStyle='#7c713e';x.lineWidth=2;x.beginPath();x.arc(o.x+7,o.y+7,6,0,7);x.fill();x.stroke()}
 }
 for(const e of enemies){if(e.dead||e.x<camera-80||e.x>camera+W+80)continue;sprite(e.type,e.x-9,e.y-23,60,70)}
 if(!boss){sprite('door',doorX,ground-142,106,149);x.fillStyle=door?'#203b52':'#715047';x.font='bold 15px system-ui';x.textAlign='center';x.fillText(player.hasKey?'Q = BOSS-TÜR ÖFFNEN':'SCHLÜSSEL FINDEN',doorX+53,ground-153)}
 if(boss&&!boss.dead){sprite('boss',boss.x-8,boss.y-34,146,154);x.fillStyle='#4a2633';x.fillRect(boss.x,boss.y-43,130,10);x.fillStyle='#f23f4a';x.fillRect(boss.x,boss.y-43,130*Math.max(0,boss.hp/boss.max),10)}
 for(const q of particles)if(q.type==='smoke')drawParticle(q);
 for(const q of particles)if(q.type!=='smoke')drawParticle(q);
 drawCompanion();
 if(player.swing){x.strokeStyle='#ffe19a';x.lineWidth=4;x.beginPath();x.moveTo(player.swing.x,player.swing.y);x.lineTo(player.x+player.w/2,player.y+20);x.stroke()}
 for(const d of defeated){
  x.save();x.translate(d.x,d.y);x.rotate(d.angle);x.globalAlpha=Math.min(1,d.life/20);const squash=1+.15*Math.sin((d.maxLife-d.life)*.3);x.scale(squash,1/squash);sprite(d.art,-d.size/2,-d.size/2,d.size,d.size);x.restore();
 }
 if(['play','inventory'].includes(screen)&&(!player.inv||Math.floor(player.inv/5)%2)){
  if(player.shield&&selected===1){
   for(let i=0;i<4;i++)drawWalkingSprite('mandarin-piece',player.x-16+i*18,player.y+10+Math.sin(performance.now()/160+i)*6,31,46,player.walkPhase+i,player.onGround&&Math.abs(player.vx)>.1);
  }else drawWalkingSprite(chars[selected].art,player.x-8,player.y-15,59,77,player.walkPhase,player.onGround&&Math.abs(player.vx)>.1);
 }
 if(player.bubble>0&&screen==='play'){x.fillStyle='rgba(244,165,207,.22)';x.strokeStyle='#f9c6e3';x.lineWidth=3;x.beginPath();x.arc(player.x+22,player.y+26,43,0,Math.PI*2);x.fill();x.stroke();x.strokeStyle='#fff';x.beginPath();x.arc(player.x+22,player.y+26,34,Math.PI*1.1,Math.PI*1.5);x.stroke()}
 if(player.shield&&screen==='play'){x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(player.x+22,player.y+28,39,0,7);x.stroke()}
 x.restore();
 // mobile controls (screen coordinates, independent of camera)
 buttons=[{id:'left',x:25,y:H-85,w:64,h:55,label:'←'},{id:'right',x:98,y:H-85,w:64,h:55,label:'→'},{id:'item',x:W-246,y:H-85,w:64,h:55,label:'F'},{id:'jump',x:W-170,y:H-85,w:64,h:55,label:'↑'},{id:'ability',x:W-94,y:H-85,w:70,h:55,label:'★'}];
 buttons.push({id:'inventory',x:W-326,y:H-85,w:64,h:55,label:'I'});
 if(nearBossDoor())buttons.push({id:'door',x:W-406,y:H-85,w:70,h:55,label:'Q'});
 for(const b of buttons){x.fillStyle='rgba(30,30,60,.55)';x.fillRect(b.x,b.y,b.w,b.h);x.fillStyle='#fff';x.font='30px system-ui';x.textAlign='center';x.fillText(b.label,b.x+b.w/2,b.y+29);if(['ability','item','door','inventory'].includes(b.id)){x.font='10px system-ui';x.fillText(b.id==='ability'?'SPEZIAL / E':b.id==='item'?'ITEM / F':b.id==='inventory'?'BAG / I':'TÜR / Q',b.x+b.w/2,b.y+47)}}
}
function drawOver(){x.fillStyle='rgba(16,14,35,.8)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.font='bold 52px system-ui';x.fillText('Spiel vorbei!',W/2,250);x.font='25px system-ui';x.fillText('Punkte: '+player.score+' · Tippe oder drücke Enter zum Neustart',W/2,310)}
function jump(){if(screen==='play'&&(player.onGround||player.swing)){playSound('jump');player.swing=null;player.vy=-JUMP_SPEED;player.onGround=false}}
addEventListener('keydown',e=>{unlockAudio();if(['ArrowLeft','ArrowRight',' ','Enter','Tab'].includes(e.key))e.preventDefault();if(screen==='victory'){handleVictoryKey(e);return}if(screen==='buddy'){buddyKey(e);return}if(screen==='inventory'){inventoryKey(e);return}keys[e.key.length===1?e.key.toLowerCase():e.key]=true;if(screen==='choose'){if(e.key==='ArrowLeft')selected=(selected+4)%5;if(e.key==='ArrowRight')selected=(selected+1)%5;if(e.key==='Enter'||e.key===' '){screen='buddy';keys={}}}else if(screen==='over'&&(e.key==='Enter'||e.key===' ')){screen='choose'}else{if(e.key===' ')jump();if(!e.repeat){if(e.key==='e'||e.key==='E')ability();if(e.key==='f'||e.key==='F')useItem();if(e.key==='q'||e.key==='Q')openBossDoor();if(e.key==='1'||e.key==='2')player.inventoryIndex=Number(e.key)-1;if(e.key==='Tab')player.inventoryIndex=1-player.inventoryIndex;if(e.key==='i'||e.key==='I')toggleInventory();if(e.key==='r'||e.key==='R')dropItem()}}});addEventListener('keyup',e=>keys[e.key.length===1?e.key.toLowerCase():e.key]=false);
const heldPointers=new Map();
function syncTouch(){keys.touchLeft=[...heldPointers.values()].includes('left');keys.touchRight=[...heldPointers.values()].includes('right')}
c.addEventListener('pointerdown',e=>{
 unlockAudio();e.preventDefault();c.setPointerCapture(e.pointerId);
 const r=c.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width,py=(e.clientY-r.top)*H/r.height;
 if(screen==='inventory'){
  const b=inventoryButtons.find(b=>px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h);if(b)inventoryAction(b.id);
 }else if(screen==='victory'){
  const b=victoryButtons.find(b=>px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h);if(b)victoryAction(b.id);
 }else if(screen==='choose'){
  if(py>185&&py<430){const n=Math.floor((px-80)/175);if(n>=0&&n<5){selected=n;screen='buddy';keys={}}}
 }else if(screen==='buddy'){
  const card=buddyCards.find(b=>px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h);if(card){selectedBuddy=card.id;reset()}
 }else if(screen==='over'){screen='choose'}
 else{
  if(py>=100&&py<=152&&px>=15&&px<=285){player.inventoryIndex=px<152?0:1;return}
  const b=buttons.find(v=>px>=v.x&&px<=v.x+v.w&&py>=v.y&&py<=v.y+v.h);
  if(b){heldPointers.set(e.pointerId,b.id);syncTouch();if(b.id==='jump')jump();if(b.id==='ability')ability();if(b.id==='item')useItem();if(b.id==='door')openBossDoor();if(b.id==='inventory')toggleInventory()}
 }
});
function releasePointer(e){heldPointers.delete(e.pointerId);syncTouch()}
for(const event of ['pointerup','pointercancel','lostpointercapture'])c.addEventListener(event,releasePointer);
let lastFrame=null,accumulator=0;
function loop(now=performance.now()){
 if(lastFrame===null)lastFrame=now;
 accumulator+=Math.max(0,Math.min(100,now-lastFrame));lastFrame=now;
 while(accumulator>=1000/60){update();accumulator-=1000/60}
 draw();requestAnimationFrame(loop);
}
addEventListener('blur',()=>{keys={};heldPointers.clear();lastFrame=null;accumulator=0});
loop();
</script>
